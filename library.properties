sentence=Display and touch driver for the Waveshare ESP32-S3-Touch-LCD-7 and -7B boards (800x480 or 1024x600 RGB LCD + GT911 touch), detected at runtime.
paragraph=One driver for the Waveshare ESP32-S3-Touch-LCD-7 (800x480) and ESP32-S3-Touch-LCD-7B (1024x600) development boards: the same sketch runs on either, and the board is identified at startup. Provides direct framebuffer access and basic drawing for the RGB LCD, and a capacitive touch driver for the GT911 controller. The panel reset, backlight and the GT911's reset (and on the -7B, the panel supply and PWM dimming) are reached through the board's I2C expander, driven for you by the companion chipguy_Waveshare-ESP32-S3-Touch-LCD-7-7B_board library (a shared, thread-safe I2C bus + expander) that this library depends on. Ships LVGL 9 starter examples so you only have to write your app.
